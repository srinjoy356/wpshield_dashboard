name: WPShield Cron Jobs

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  hourly-crons:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    steps:
      - name: Run all crons
        env:
          BASE_URL: ${{ secrets.RENDER_APP_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -o /dev/null -w "threat-intel: %{http_code}\n"      -H "x-cron-secret: $SECRET" "$BASE_URL/api/cron/threat-intel"      || echo "threat-intel failed"
          curl -sf -o /dev/null -w "vuln-check: %{http_code}\n"        -H "x-cron-secret: $SECRET" "$BASE_URL/api/cron/vuln-check"        || echo "vuln-check failed"
          curl -sf -o /dev/null -w "uptime-check: %{http_code}\n"      -H "x-cron-secret: $SECRET" "$BASE_URL/api/cron/uptime-check"      || echo "uptime-check failed"
          curl -sf -o /dev/null -w "hardening-audit: %{http_code}\n"   -H "x-cron-secret: $SECRET" "$BASE_URL/api/cron/hardening-audit"   || echo "hardening-audit failed"
          curl -sf -o /dev/null -w "safe-browsing: %{http_code}\n"     -H "x-cron-secret: $SECRET" "$BASE_URL/api/cron/safe-browsing"     || echo "safe-browsing failed"
          curl -sf -o /dev/null -w "reconciliation: %{http_code}\n"    -H "x-cron-secret: $SECRET" "$BASE_URL/api/cron/reconciliation"    || echo "reconciliation failed"
          curl -sf -o /dev/null -w "scheduled-reports: %{http_code}\n" -H "x-cron-secret: $SECRET" "$BASE_URL/api/cron/scheduled-reports" || echo "scheduled-reports failed"
          curl -sf -o /dev/null -w "send-reports: %{http_code}\n"      -H "x-cron-secret: $SECRET" "$BASE_URL/api/cron/send-reports"      || echo "send-reports failed"

  uptime-check:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/5 * * * *'
    steps:
      - name: Uptime check
        env:
          BASE_URL: ${{ secrets.RENDER_APP_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -o /dev/null -w "uptime-check: %{http_code}\n" -H "x-cron-secret: $SECRET" "$BASE_URL/api/cron/uptime-check" || echo "uptime-check failed"